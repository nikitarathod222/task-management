<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #6ea8dc, #4a90e2);
        overflow: hidden;
    }

    body::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
        top: -100px;
        right: -100px;
    }

    body::after {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        background: rgba(255,255,255,0.08);
        border-radius: 50%;
        bottom: -100px;
        left: -100px;
    }

    .register-wrapper {
        width: 900px;
        height: 550px;
        background: linear-gradient(135deg, #0d47a1, #1976d2);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        position: relative;
    }

    .register-card {
        width: 380px;
        padding: 30px;
        border-radius: 20px;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(20px);
        color: white;
        text-align: center;
    }

    .register-card h2 {
        font-weight: 600;
        margin-bottom: 15px;
    }

    .form-control {
        margin-top: 10px;
        border-radius: 10px;
        border: none;
        background: rgba(255,255,255,0.9);
    }

    .form-control:focus {
        box-shadow: none;
    }

    select.form-control {
        color: #333;
    }

    .btn-register {
        margin-top: 20px;
        width: 100%;
        border-radius: 10px;
        background: #0d47a1;
        color: white;
        font-weight: 500;
        transition: 0.3s;
    }

    .btn-register:hover {
        background: #08306b;
    }

    .extra-links {
        margin-top: 15px;
        font-size: 14px;
        color: #ddd;
    }

    .extra-links a {
        color: #fff;
        text-decoration: none;
    }

    .extra-links a:hover {
        text-decoration: underline;
    }

    .alert {
        background: rgba(255,255,255,0.2);
        border: none;
        color: white;
    }

</style>
</head>

<body>

<div class="register-wrapper">

    <div class="register-card">

        <h5>Your logo</h5>
        <h2>Register</h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert mt-2">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input class="form-control" name="name" placeholder="Full Name" required>

            <input class="form-control" type="email" name="email" placeholder="Email" required>

            <input class="form-control" type="password" name="password" placeholder="Password" required>

            <select class="form-control" name="role" required>
                <option value="">Select Role</option>
                <option value="manager">Manager</option>
                <option value="employee">Employee</option>
            </select>

            <button class="btn btn-register">Create Account</button>
        </form>

        <div class="extra-links">
            Already have an account? <a href="/login">Login</a>
        </div>

    </div>

</div>

</body>
</html>
