<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login UI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #6ea8dc, #4a90e2);
        overflow: hidden;
    }

    /* Background Shapes */
    body::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
        top: -100px;
        right: -100px;
    }

    body::after {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        background: rgba(255,255,255,0.08);
        border-radius: 50%;
        bottom: -100px;
        left: -100px;
    }

    /* Main Container */
    .login-wrapper {
        width: 900px;
        height: 500px;
        background: linear-gradient(135deg, #0d47a1, #1976d2);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        position: relative;
    }

    /* Glass Card */
    .login-card {
        width: 350px;
        padding: 30px;
        border-radius: 20px;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(20px);
        color: white;
        text-align: center;
    }

    .login-card h2 {
        font-weight: 600;
        margin-bottom: 10px;
    }

    .login-card small {
        color: #ddd;
    }

    /* Inputs */
    .form-control {
        margin-top: 15px;
        border-radius: 10px;
        border: none;
        background: rgba(255,255,255,0.9);
    }

    .form-control:focus {
        box-shadow: none;
        border: none;
    }

    /* Button */
    .btn-login {
        margin-top: 20px;
        width: 100%;
        border-radius: 10px;
        background: #0d47a1;
        color: white;
        font-weight: 500;
        transition: 0.3s;
    }

    .btn-login:hover {
        background: #08306b;
    }

    /* Links */
    .extra-links {
        margin-top: 10px;
        font-size: 14px;
        color: #ddd;
    }

    .extra-links a {
        color: #fff;
        text-decoration: none;
    }

    .extra-links a:hover {
        text-decoration: underline;
    }

    /* Social Buttons */
    .social-login {
        margin-top: 15px;
    }

    .social-login button {
        margin: 5px;
        border-radius: 8px;
        border: none;
        padding: 8px 12px;
        font-size: 14px;
        background: white;
        cursor: pointer;
    }

</style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        
        <h2>Login</h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-warning mt-2">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="email" name="email" class="form-control" placeholder="Email" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>

            <div class="text-end extra-links">
                <a href="#">Forgot Password?</a>
            </div>

            <button class="btn btn-login">Sign in</button>
        </form>

        

        

        <div class="extra-links mt-3">
            Don’t have an account? <a href="/register">Register</a>
        </div>

    </div>

</div>

</body>
</html>
