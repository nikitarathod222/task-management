<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            height: 100vh;
            background: #212529;
            color: white;
            padding: 20px;
        }

        .sidebar h4 {
            margin-bottom: 30px;
        }

        .sidebar a {
            color: #adb5bd;
            display: block;
            margin: 10px 0;
            text-decoration: none;
            font-size: 15px;
            padding: 8px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            color: white;
            background: #343a40;
        }

        .sidebar a.active {
            background: #0d6efd;
            color: white;
        }

        .topbar {
            background: white;
            padding: 12px 20px;
            border-bottom: 1px solid #ddd;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

      
        <div class="col-md-2 sidebar">

            <h4><i class="bi bi-kanban"></i> Task Manager</h4>

            <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>

            {% if session['role'] == 'manager' %}
                <a href="/kanban"><i class="bi bi-columns-gap"></i> Kanban Board</a>
                <a href="/employees"><i class="bi bi-people"></i> Employees</a>
            {% endif %}

            {% if session['role'] == 'admin' %}
                <a href="#"><i class="bi bi-person-plus"></i> Manage Users</a>
            {% endif %}

            <a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>

        </div>

    
        <div class="col-md-10">

            <div class="topbar d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Dashboard</h5>
                <div>👤 {{ session['role']|capitalize }}</div>
            </div>

            <div class="p-4">
                {% block content %}{% endblock %}
            </div>

        </div>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Your JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>



</body>
</html>
